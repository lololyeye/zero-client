<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'" />
<title>ZERO update</title>
<link rel="stylesheet" href="update.css" />
</head>
<body>
<div class="backdrop" id="backdrop">
  <section class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="sub">
    <div class="glow" aria-hidden="true"></div>
    <header>
      <div class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="currentColor" d="M8.2 3h7.6A5.2 5.2 0 0 1 21 8.2v5.1a5.2 5.2 0 0 1-5.2 5.2h-4.6l-3.6 2.7c-.6.4-1.4 0-1.4-.7v-2.2A5.2 5.2 0 0 1 3 13.3V8.2A5.2 5.2 0 0 1 8.2 3Zm.6 4.3v1.6h4.4L8.6 13v1.6h6.6V13h-4.3l4.5-4.1V7.3H8.8Z"/></svg></div>
      <div class="head-txt">
        <div class="eyebrow" id="eyebrow">Update available</div>
        <h1 id="title">ZERO</h1>
      </div>
    </header>
    <div class="versions" id="versions">
      <span class="v from" id="from"></span>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-5-5 5 5-5 5"/></svg>
      <span class="v to" id="to"></span>
      <span class="date" id="date"></span>
    </div>
    <p class="sub" id="sub"></p>

    <div class="notes" id="notes-wrap">
      <div class="label">What's new</div>
      <ul id="notes"></ul>
    </div>

    <div class="progress" id="progress" hidden>
      <div class="steps" id="steps">
        <span data-step="downloading">Download</span><i></i>
        <span data-step="verifying">Verify</span><i></i>
        <span data-step="installing">Install</span><i></i>
        <span data-step="restart">Restart</span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div class="fill" id="fill"></div></div>
      <div class="stats">
        <span class="pct" id="pct">0%</span>
        <span id="size"></span>
        <span id="speed"></span>
        <span id="eta"></span>
      </div>
    </div>

    <div class="error" id="error" role="alert" hidden></div>

    <footer>
      <span class="status" id="status" aria-live="polite"></span>
      <div class="btns" id="btns"></div>
    </footer>
  </section>
</div>
<script src="update.js"></script>
</body>
</html>
