<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'" />
<title>ZERO update</title>
<link rel="stylesheet" href="update.css" />
</head>
<body>
<div class="backdrop" id="backdrop">
  <section class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="lead">
    <div class="halo" aria-hidden="true"></div>
    <header class="head">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 256 256" width="30" height="30"><path d="M84 52h88c22.1 0 40 17.9 40 40v58c0 22.1-17.9 40-40 40h-52l-34.6 25.4c-3.3 2.4-7.9 0-7.9-4.1V188.6C62.4 184.2 44 169.4 44 150V92c0-22.1 17.9-40 40-40z" fill="currentColor"/><path d="M92 86h74v15.5l-50.5 50H166V168H90v-15.5l50.5-50H92z" fill="#15171c"/></svg></div>
      <div class="head-txt">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title">ZERO</h1>
        <div class="meta" id="meta"></div>
      </div>
      <button class="close" id="close" type="button" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </header>

    <div class="chips" id="chips"></div>
    <p class="lead" id="lead"></p>

    <div class="notes" id="notes" hidden></div>

    <div class="stage" id="stage" aria-live="polite"></div>
  </section>
</div>
<script src="update.js"></script>
</body>
</html>
