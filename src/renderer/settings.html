<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: zero-asset:; script-src 'self'" />
<title>ZERO Settings</title>
<link rel="stylesheet" href="settings.css" />
</head>
<body>
<div class="layer" id="layer">
  <div class="side-region">
    <aside class="side">
      <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 3h7.6A5.2 5.2 0 0 1 21 8.2v5.1a5.2 5.2 0 0 1-5.2 5.2h-4.6l-3.6 2.7c-.6.4-1.4 0-1.4-.7v-2.2A5.2 5.2 0 0 1 3 13.3V8.2A5.2 5.2 0 0 1 8.2 3Zm.6 4.3v1.6h4.4L8.6 13v1.6h6.6V13h-4.3l4.5-4.1V7.3H8.8Z"/></svg><span>ZERO</span></div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg><input id="search" type="search" placeholder="Search" aria-label="Search settings" spellcheck="false" /></label>
      <nav id="nav" aria-label="Settings sections"></nav>
      <div class="side-foot" id="sidefoot"></div>
    </aside>
  </div>
  <div class="main-region" id="scroller">
    <main class="main" id="content" tabindex="-1"></main>
    <div class="close-wrap">
      <button class="close" id="close" aria-label="Close settings"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.3 5.3a1 1 0 1 1 1.4 1.4L13.42 12l5.3 5.3a1 1 0 0 1-1.42 1.4L12 13.42l-5.3 5.3a1 1 0 0 1-1.4-1.42L10.58 12l-5.3-5.3a1 1 0 0 1 1.42-1.4L12 10.58l5.3-5.3Z"/></svg></button>
      <span>ESC</span>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="settings.js"></script>
</body>
</html>
